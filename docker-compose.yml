services:
  mongodb:
    image: mongo:7.0
    container_name: meta-vis-mongodb
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # Single-node replica set is required for multi-document transactions
    # (used by the ingest orchestrator for atomicity — see CLAUDE_TODO #10).
    # Port is bound to 127.0.0.1 above — not reachable from the internet.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export MONGO_INITDB_ROOT_USERNAME=admin
        export MONGO_INITDB_ROOT_PASSWORD="$${MONGO_ROOT_PASSWORD}"
        KF=/data/configdb/mongo-keyfile
        if [ ! -s "$$KF" ]; then
          openssl rand -base64 756 > "$$KF"
        fi
        chmod 400 "$$KF"
        chown 999:999 "$$KF" || true
        exec docker-entrypoint.sh mongod \
          --replSet rs0 \
          --keyFile "$$KF" \
          --bind_ip_all
    environment:
      MONGO_INITDB_DATABASE: meta-vis-dev
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      # Idempotently initiate the replica set once mongod is up. The client
      # connects via `directConnection=true` (see backend/app/database.py),
      # so the rs member name never needs to be reachable from outside the
      # container — 'localhost:27017' works for the mongod's self-election.
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u admin -p $$MONGO_ROOT_PASSWORD --authenticationDatabase admin --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\" | grep -q 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  minio:
    image: minio/minio
    container_name: meta-vis-minio
    restart: unless-stopped
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        export MINIO_ROOT_USER="$${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}"
        export MINIO_ROOT_PASSWORD="$${OBJECT_STORAGE_SECRET_KEY:-minioadminpassword}"
        exec minio server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meta-vis-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      CORS_ORIGINS: http://localhost:5173
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meta-vis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  mongodb_data:
  mongodb_config:
  minio_data:
  frontend_node_modules:
