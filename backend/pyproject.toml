[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-vis-app"
version = "0.1.0"
description = "Visualisation backend for nf-core/taxprofiler output"
requires-python = ">=3.13"

dependencies = [
    # 0.136.3 was a malicious release (MAL-2026-4750): added an undocumented
    # `fastar` dependency under fastapi[standard]. Excluded until upstream
    # ships a clean replacement.
    "fastapi>=0.111.0,!=0.136.3",
    "uvicorn[standard]>=0.29.0",
    "motor>=3.4.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # Auth — OIDC access tokens issued by Keycloak, validated against the
    # realm JWKS. pyjwt's PyJWKClient handles fetching + caching the keys.
    "pyjwt[crypto]>=2.8.0",
    # Required by FastAPI for multipart uploads (ingest bundle endpoint).
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.0",
    "mongomock-motor>=0.0.21",
    "bandit[toml]>=1.9.0",
    "mypy>=1.8.0",
    "pip-audit>=2.6.0",
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.0.0",
    "types-PyYAML>=6.0.0",
    "sphinx>=7.0.0",
    "sphinx-lint>=0.9.0",
    "furo>=2024.01.29",
    "sphinx-rtd-theme>=2.0.0",
    "pytest-cov>=5.0.0",
    # The ingest CLI (repo-root ingest.py) declares its own dependencies inline
    # (PEP 723); its tests under tests/unit/test_cli_* load it and import
    # requests directly, so the test environment needs it too.
    "requests>=2.32.0",
]

# Local defaults so a plain `uv sync --extra dev` matches CI and the images.
# CI and the Dockerfiles also pass the equivalent flags explicitly.
[tool.uv]
# Never install the project itself: app/ is imported from the working dir.
package = false
# Wheels only: never execute a dependency's build scripts.
no-build = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# Pinned explicitly: ruff 0.16 widened its default rule set (UP, B, I, …).
# These are the pre-0.16 defaults; adopting more rules is a deliberate change.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = false
strict_equality = true
ignore_missing_imports = true
