# Server block for the frontend container.
#
# The host VM's nginx terminates TLS and proxies the meta-vis hostname to
# this container's port 8080. Inside the container we:
#   - serve the SPA bundle from /usr/share/nginx/html
#   - proxy /api/ to the backend container on the compose network
# so the host nginx only has to know one upstream per app.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed Vite assets; index.html stays uncached so deploys
    # roll out immediately.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API requests go to the backend container. Service name `backend` is
    # resolved on the compose network (see docker-compose.prod.yml).
    #
    # 127.0.0.11 is Docker's embedded DNS (present on user-defined networks).
    # Resolving via a variable defers the lookup to request time instead of
    # startup, so nginx still boots if the backend is briefly down or not yet
    # registered — it returns 502 for /api until backend is back, rather than
    # the whole frontend failing to start.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ingest uploads can be large (see ingest_upload_max_compressed_bytes,
        # default 2 GiB). 0 disables nginx's client-body cap for this location.
        client_max_body_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback — any unknown path returns index.html so React Router
    # can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
