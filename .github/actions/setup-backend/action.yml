name: Set up backend
description: >
  Install Python and uv, then sync the backend's locked dependencies
  (runtime + dev extra) from backend/uv.lock. Single place to bump the uv
  version or change install flags for every backend CI job.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Set up uv
      # Pinned to a commit SHA: setup-uv publishes no floating major tag (e.g.
      # v10) after v7, and a SHA cannot be re-pointed. Dependabot bumps both.
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        # Keep in step with the uv image tag in backend/Dockerfile*.
        version: "0.12.18"
        enable-cache: true
        cache-dependency-glob: backend/uv.lock

    - name: Install locked dependencies
      shell: bash
      working-directory: backend
      env:
        UV_PYTHON_DOWNLOADS: never
      #   --locked             fail if uv.lock is out of date with pyproject.toml
      #   --no-build           wheels only: never execute a package's build scripts
      #   --no-install-project tests and tools import app/ from the working dir
      run: uv sync --locked --no-build --no-install-project --extra dev

    # Later steps call tools (pytest, mypy, ruff, …) directly rather than via
    # `uv run`: the venv above is the only place they come from, and is only
    # ever populated by the locked, wheels-only sync.
    - name: Put backend venv on PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
