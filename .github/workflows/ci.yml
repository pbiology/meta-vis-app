name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up backend
        uses: ./.github/actions/setup-backend

      - name: Run tests
        env:
          MONGODB_DB_NAME: test
          JWT_SECRET: ci-test-secret
        run: uv run --no-sync pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  security:
    name: Security scan (Bandit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up backend
        uses: ./.github/actions/setup-backend

      - name: Run Bandit security scan
        run: uv run --no-sync bandit -r app/ -f json -o bandit-report.json || true

      - name: Check Bandit results
        run: |
          python3 << 'EOF'
          import json
          import sys

          with open('bandit-report.json') as f:
              report = json.load(f)

          issues = [i for i in report.get('results', []) if not i.get('test_id', '').startswith('NOSEC')]

          high = [i for i in issues if i.get('severity') == 'HIGH']
          medium = [i for i in issues if i.get('severity') == 'MEDIUM']

          if high or medium:
              print(f"\n❌ Found {len(high)} HIGH and {len(medium)} MEDIUM severity issues:")
              for issue in high + medium:
                  print(f"  [{issue.get('test_id')}] {issue.get('issue_text')} ({issue.get('severity')})")
              sys.exit(1)
          else:
              print("\n✓ No high or medium severity issues found")
          EOF

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

  type-check:
    name: Type checking (mypy)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up backend
        uses: ./.github/actions/setup-backend

      - name: Run mypy type check
        run: uv run --no-sync mypy app/

  frontend-type-check:
    name: Frontend type checking (tsc)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tsc type check
        run: npm run typecheck

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run vitest
        run: npm run test:run

  dependencies-audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up backend
        if: matrix.component == 'backend'
        uses: ./.github/actions/setup-backend

      - name: Audit backend dependencies
        if: matrix.component == 'backend'
        working-directory: backend
        run: |
          # Audit exactly the locked runtime set that ships in the image (no
          # dev extra), not whatever would resolve fresh today.
          uv export --locked --no-emit-project --format requirements-txt \
            -o requirements-audit.txt
          # PYSEC-2025-183: disputed pyjwt advisory about HMAC key length
          # enforcement. No fix released; supplier maintains the key length
          # is the application's responsibility. Our tokens are RS256-signed
          # by Keycloak (not HMAC), so this does not apply.
          uv run --no-sync pip-audit --disable-pip -r requirements-audit.txt \
            --ignore-vuln PYSEC-2025-183

      - name: Set up Node (frontend)
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run npm audit (frontend)
        if: matrix.component == 'frontend'
        working-directory: frontend
        run: npm audit --audit-level=high

  format-check:
    name: Code formatting
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up backend
        if: matrix.component == 'backend'
        uses: ./.github/actions/setup-backend

      - name: Check backend formatting (Ruff)
        if: matrix.component == 'backend'
        working-directory: backend
        run: uv run --no-sync ruff format --check app/

      - name: Set up Node (frontend)
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Prettier check (frontend)
        if: matrix.component == 'frontend'
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run format:check
