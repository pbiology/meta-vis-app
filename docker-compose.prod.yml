# Example production / stage compose stack.
#
# This file ships as ONE example deployment shape — a single host running
# the two app containers behind an existing host nginx, with MongoDB on a
# separate VM. It is NOT the canonical prod stack; OpenShift, K8s, ECS, and
# plain systemd-on-a-VM deploys are equally valid. The canonical contract
# between the app and its environment is `backend/.env.example` (every key
# the backend expects) plus the published images on Docker Hub. Adapt this
# file, or replace it entirely with your own orchestration.
#
# Configuration:
#   backend/.env.prod  — gitignored. Copy backend/.env.example, fill in
#                        real values for your deploy (MongoDB URI, KC issuer,
#                        CORS origin, secrets).
#   Frontend OIDC      — either baked into the image at build time via
#                        frontend/.env.prod (see frontend/Dockerfile.prod),
#                        or injected at deploy time via VITE_OIDC_* env vars
#                        on the frontend service below (the image's entrypoint
#                        writes them into /usr/share/nginx/html/config.js at
#                        container start, and they override any baked values).
#
# In this example, MongoDB lives on a separate VM and is reached via
# MONGODB_URI in backend/.env.prod. No MinIO: blob_store falls back to the
# MongoDB `blobs` collection when no OBJECT_STORAGE_* env vars are set. The
# host VM's existing nginx proxies the meta-vis hostname to the frontend
# container at 127.0.0.1:8080.
#
# Images are built and pushed via `make image-backend-stage` /
# `make image-frontend-stage` (or the equivalent buildx commands); the
# deploy side only pulls — there is no build step here.
#
# Pull + start:  docker compose -f docker-compose.prod.yml pull
#                docker compose -f docker-compose.prod.yml up -d
# Logs:          docker compose -f docker-compose.prod.yml logs -f
#
# The :stage tag is a moving pointer to the latest stage build. Immutable
# versioned images (e.g. :stage-0.0.1) are also published for traceability.

services:
  backend:
    image: docker.io/clinicalgenomics/metavis-backend:stage
    container_name: meta-vis-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    # Internal only — the frontend container reverse-proxies to this on the
    # compose network. Not exposed on the host.
    expose:
      - "8000"
    networks:
      - meta-vis
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/docs', timeout=2).status==200 else 1)\""
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: docker.io/clinicalgenomics/metavis-frontend:stage
    container_name: meta-vis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Optional: inject OIDC config at deploy time instead of baking it into
    # the image. The entrypoint script writes these into a runtime config.js
    # that the SPA reads on load; any value set here overrides what was baked
    # in via frontend/.env.prod at build time. Leave the block commented to
    # keep using the baked-in values.
    # environment:
    #   VITE_OIDC_AUTHORITY: "https://<kc-host>/realms/<realm>"
    #   VITE_OIDC_CLIENT_ID: "meta-vis-frontend"
    #   VITE_OIDC_REDIRECT_URI: "https://<frontend-host>/auth/callback"
    #   VITE_OIDC_POST_LOGOUT_REDIRECT_URI: "https://<frontend-host>/"
    # Bind to loopback only — the host nginx forwards public traffic here.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - meta-vis

networks:
  meta-vis:
    driver: bridge
